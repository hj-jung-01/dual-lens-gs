name: dual_lens

d_feature: 128
num_depth_candidates: 128

gaussian_adapter:
  gaussian_scale_min: 0.5
  gaussian_scale_max: 15.0
  sh_degree: 4

# pretrained weights, only used when training from scratch
unimatch_weights_path: checkpoints/gmdepth-scale1-resumeflowthings-scannet-5d9d7964.pth
cse_weights:
  extractor: checkpoints/feature_extraction.pth
  restoration: checkpoints/c2_matching_restoration.pth

# coarse network (cost volume on the low-resolution pair)
downscale_factor: 4
shim_patch_size: 4
multiview_trans_attn_split: 2
costvolume_unet_feat_dim: 128
costvolume_unet_channel_mult: [1, 1, 1]
costvolume_unet_attn_res: [4]
depth_unet_feat_dim: 32
depth_unet_attn_res: [16]
depth_unet_channel_mult: [1, 1, 1, 1, 1]

# fine network
propagation_steps: 18
foundation_image_size: [256, 256]
