defaults:
  - dataset: re10k
  - optional dataset/view_sampler_dataset_specific_config: ${dataset/view_sampler}_${dataset}
  - model/encoder: dual_lens
  - model/decoder: splatting_cuda
  - loss: [mse, lpips]

wandb:
  project: dual-lens-gs
  entity: null
  name: default
  mode: disabled
  id: null

mode: train

dataset:
  overfit_to_scene: null

data_loader:
  train:
    num_workers: 10
    persistent_workers: true
    batch_size: 2
    seed: 1234
  test:
    num_workers: 4
    persistent_workers: false
    batch_size: 1
    seed: 2345
  val:
    num_workers: 1
    persistent_workers: true
    batch_size: 1
    seed: 3456

optimizer:
  lr: 2.e-4
  warm_up_steps: 2000
  cosine_lr: true

checkpointing:
  load: null
  every_n_train_steps: 20000
  save_top_k: -1
  resume: true

train:
  enhancement_loss_weight: 0.1
  print_log_every_n_steps: 100

test:
  output_path: outputs/test
  compute_scores: true
  save_image: false
  eval_time_skip_steps: 5

seed: 111123

trainer:
  max_steps: 400_001
  val_check_interval: 1000
  gradient_clip_val: 0.5
  num_sanity_val_steps: 2
  num_nodes: 1

output_dir: null
